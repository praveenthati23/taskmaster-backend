options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute ssh backend --zone=us-central1-a --command="
          cd ~/taskmaster-backend &&
          git fetch origin dev &&
          git reset --hard origin/dev &&
          npm install &&
          pm2 restart taskmaster-backend || pm2 start server.js --name taskmaster-backend
        "
